function learn(){let courses=[['Product analytics foundations','4 lessons · 1h 20m','Start with metrics, funnels and experiments.','photo-1551288049-bebda4e38f71','Beginner',76],['Product discovery in practice','5 lessons · 2h 10m','Learn to frame problems, interview users and test assumptions.','photo-1460925895917-afdab827c52f','Intermediate',35],['Roadmapping & prioritisation','3 lessons · 55m','Connect customer needs to clear product decisions.','photo-1454165804606-c3d57bc86b40','Intermediate',0],['Build your product case study','Project · 2–3 hours','Turn your learning into evidence employers can evaluate.','photo-1552664730-d307ca884978','Portfolio project',0]];return `${pageHead('Learning that moves you forward','Focused learning paths selected to close the gaps between you and your target role.',btn('View career roadmap →',"go('career')",'secondary'))}<div class="grid cols-3">${courses.map((c,i)=>`<div class="card photo-card"><img class="cover" style="height:145px" src="${img(c[3],650)}" alt="Learning workspace"><div class="inside"><span class="pill purple">${c[4]}</span><h3 style="font-size:16px;margin-top:10px">${c[0]}</h3><div class="tiny muted">${c[1]}</div><p>${c[2]}</p><div class="progress"><span style="width:${c[5]}%"></span></div><div style="display:flex;justify-content:space-between;margin:8px 0 15px;font-size:10px;color:var(--muted)"><span>${c[5]?c[5]+'% complete':'Not started'}</span><span>Recommended for your goal</span></div>${btn(c[5]?'Continue learning →':'Start learning →',`openLesson('${c[0]}')`,'small')}</div></div>`).join('')}</div><div class="section-title"><h2>Curated resources from your network</h2></div><div class="card">${[['The product manager interview guide','Shared by Sarah Collins · 12 min read'],['Metrics that matter for early-stage products','Shared by Priya Raman · 8 min read'],['A practical guide to product discovery','Shared by Amina Yusuf · 15 min read']].map((x,i)=>`<div class="listrow"><div class="stat-icon">▤</div><div class="grow"><b>${x[0]}</b><p>${x[1]}</p></div><button class="btn secondary small" onclick="toast('Resource saved to your learning list')">Save resource</button></div>`).join('')}</div>`}

function openCommunity(){modal('Create a community',`<div class="field"><label>Community name</label><input id="communityName" placeholder="e.g. Product Builders Circle"></div><div class="field"><label>Topic</label><select><option>Career growth</option><option>Product</option><option>Leadership</option><option>Technology</option><option>Entrepreneurship</option></select></div><div class="field"><label>Description</label><textarea placeholder="Who is this for, and what will members do together?"></textarea></div>`,'Create community','saveCommunity()')}
function saveCommunity(){const n=document.getElementById('communityName').value||'New community';communities.unshift({name:n,desc:'A new space for shared learning, peer support and career progress.',members:'1 member',topic:'Career growth',img:'photo-1521737711867-e3b97375f902'});joined.add(n);closeModal();go('communities');toast('Community created in this prototype')}
function openPost(){modal('Share with your network',`<div class="field"><label>Your update</label><textarea id="postText" placeholder="Share a career win, ask a question or pass on something useful…"></textarea></div><div class="field"><label>Topic</label><select><option>Career growth</option><option>Learning</option><option>Product leadership</option><option>Opportunities</option></select></div><p class="tiny muted">Be generous with knowledge and protect private information.</p>`,'Publish update','savePost()')}
function savePost(){const textBody=document.getElementById('postText').value||'I am working on my next career milestone. What advice would you share?';closeModal();toast('Your update has been published to the demo feed');feedFilter='For you';go('feed');setTimeout(()=>{const node=document.querySelector('.content');if(node){const card=document.createElement('div');card.className='card';card.style.marginBottom='15px';card.innerHTML=`<div class="person"><div class="avatar">MM</div><div><b>${profileName}</b><small>Just now · Your network</small></div></div><p style="font-size:13px;line-height:1.7;margin:16px 0">${escapeHtml(textBody)}</p><span class="pill purple">Career growth</span><div style="margin-top:14px"><button class="link" onclick="toast('Reaction added')">♡ Like</button></div>`;const col=node.querySelector('.grid.cols-2>div');if(col)col.insertBefore(card,col.children[1])}},20)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openOutcome(){modal('Log a career outcome',`<div class="field"><label>Outcome type</label><select id="outType"><option>Learning</option><option>Networking</option><option>Introduction</option><option>Interview</option><option>Hire</option><option>Promotion</option><option>Skill acquired</option></select></div><div class="field"><label>What happened?</label><input id="outTitle" placeholder="e.g. Completed SQL fundamentals"></div><div class="field"><label>Date</label><input type="date" id="outDate" value="2026-10-10"></div><div class="field"><label>Evidence status</label><select id="outStatus"><option>Self-reported</option><option>Partner-confirmed</option></select></div><div class="field"><label>Notes / evidence link (optional)</label><textarea placeholder="Add a link, context or confirmation detail"></textarea></div>`,'Log outcome','saveOutcome()')}
function saveOutcome(){const type=document.getElementById('outType').value,title=document.getElementById('outTitle').value||'Career action logged',date=document.getElementById('outDate').value,status=document.getElementById('outStatus').value;outcomes.unshift({type,title,date,status});closeModal();go('outcomes');toast('Outcome added to the ledger')}
function openLesson(name){modal(name,`<div style="background:#f2edff;border-radius:12px;padding:20px;margin-bottom:17px"><div class="eyebrow">LEARNING PATH · SAMPLE LESSON</div><h3 style="font-size:18px">Start with the question, not the metric.</h3><p class="muted" style="line-height:1.7">Good product analytics connects a user or business question to a measurable signal. Define the decision first, then choose the metric that can inform it.</p></div><div class="task"><span class="stat-icon">1</span><div><b>Define a product question</b><p>What behaviour are you trying to understand?</p></div></div><div class="task"><span class="stat-icon">2</span><div><b>Choose a signal</b><p>Activation, retention, conversion or task completion.</p></div></div><div class="task"><span class="stat-icon">3</span><div><b>Record what changed</b><p>Summarise what you learned and what you would do next.</p></div></div>`,'Mark lesson complete','completeLesson()')}
function completeLesson(){completed.add('Complete product analytics fundamentals');outcomes.unshift({type:'Learning',title:'Completed product analytics learning lesson',date:'Today',status:'Self-reported'});closeModal();go('outcomes');toast('Lesson completed and outcome logged')}
function openSession(){modal('Host a live session',`<div class="field"><label>Session title</label><input placeholder="What will people learn?"></div><div class="field"><label>Host</label><input value="${profileName}"></div><div class="field"><label>Date and time</label><input type="datetime-local"></div><div class="field"><label>Community</label><select>${communities.map(c=>`<option>${c.name}</option>`).join('')}</select></div><div class="field"><label>Description</label><textarea placeholder="Outline the session and who should attend"></textarea></div>`,'Create session',"closeModal();toast('Session draft created')")}
function openContact(){modal('Discuss an ASCENDR pilot',`<p class="muted" style="line-height:1.6">Tell us about your network. This demo captures the intended pilot enquiry flow; it does not send data to a server.</p><div class="field"><label>Organization</label><input placeholder="Fund, university, accelerator or company"></div><div class="field"><label>Your work email</label><input type="email" placeholder="you@organization.com"></div><div class="field"><label>Network size</label><select><option>Under 250 members</option><option>250–1,000 members</option><option>1,000–5,000 members</option><option>5,000+ members</option></select></div><div class="field"><label>What outcome do you want to measure?</label><textarea placeholder="Career activation, skills, introductions, interviews, hires…"></textarea></div>`,'Prepare pilot enquiry',"closeModal();toast('Pilot enquiry prepared — connect a backend to submit')")}
function openSkills(){modal('Edit your skills',`<p class="muted">Select skills you can evidence today. Career gaps should be computed from the role requirements minus these skills.</p>${['Communication','Customer support','Stakeholder management','Analytics','Product discovery','Product analytics','Roadmapping','SQL'].map((s,i)=>`<label class="goal-option"><input type="checkbox" ${i<4?'checked':''}> ${s}</label>`).join('')}`,'Save skills',"closeModal();toast('Skills updated in this demo')")}
function saveProfile(){const n=document.getElementById('profName')?.value;if(n)profileName=n;const g=document.getElementById('targetRole')?.value;if(g)goal=g;const h=document.getElementById('targetHorizon')?.value;if(h)goalHorizon=h;render();toast('Profile and preferences saved')}
function showPerson(name){const p=people.find(x=>x.name===name)||people[0];modal(p.name,`<div class="person" style="margin-bottom:18px">${avatar(p,70)}<div><h3 style="font-size:18px">${p.role}</h3><p class="muted" style="margin:6px 0">${p.company}</p><span class="pill ${p.band}">${p.match}</span></div></div><h3>Why ASCENDR recommends this person</h3><p class="muted" style="line-height:1.7">${p.name==='Sarah Collins'?'Sarah made a similar transition into product management and can share practical advice about transferable skills and the first 90 days.':'This person has experience relevant to your target role and may help you understand expectations, build skills or discover opportunities.'}</p><h3 style="margin-top:18px">Relevant expertise</h3><p>${p.skills.split(', ').map(s=>`<span class="tag">${s}</span>`).join('')}</p>`,'Request introduction',`closeModal();requestConnect('${p.name}')`)}
function showJob(title){const j=jobs.find(x=>x.title===title)||jobs[0];modal(j.title,`<span class="pill green">RELEVANT OPPORTUNITY</span><h3 style="font-size:17px;margin-top:15px">${j.co}</h3><p class="muted">${j.loc} · ${j.type}</p><p style="line-height:1.7">This opportunity aligns with your career goal. You already bring transferable strengths in communication and customer understanding. The key areas to strengthen are ${j.skills.join(' and ').toLowerCase()}.</p><h3>Recommended next steps</h3><div class="task"><span class="stat-icon">1</span><div><b>Tailor your profile</b><p>Highlight relevant projects and measurable outcomes.</p></div></div><div class="task"><span class="stat-icon">2</span><div><b>Find a warm connection</b><p>Check your network before applying cold.</p></div></div>`,'Save & track',`closeModal();toggleApply('${title}')`)}
function showCommunity(name){const c=communities.find(x=>x.name===name)||communities[0];modal(c.name,`<img src="${img(c.img,650)}" style="width:100%;height:160px;object-fit:cover;border-radius:11px;margin-bottom:15px"><span class="pill purple">${c.topic}</span><p style="line-height:1.7">${c.desc}</p><p class="muted">${c.members} · Sample community</p><h3>What members do</h3><div class="task"><span class="stat-icon">◎</span><div><b>Peer introductions</b><p>Meet people with relevant experience and goals.</p></div></div><div class="task"><span class="stat-icon">▤</span><div><b>Share resources</b><p>Exchange templates, lessons and practical feedback.</p></div></div>` ,joined.has(name)?'Leave community':'Join community',`closeModal();toggleJoin('${name}')`)}
function openComment(name){modal('Reply to '+name,`<div class="field"><label>Your comment</label><textarea id="commentText" placeholder="Share something useful…"></textarea></div>`,'Post comment',"closeModal();toast('Comment added to the demo conversation')")}
function showJobFromCard(t){showJob(t)}
render();
</script></body></html>
